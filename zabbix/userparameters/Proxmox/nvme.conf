---

## 1. Rôle

Ce fichier permet à Zabbix Agent 2 de récupérer plusieurs indicateurs SMART du périphérique NVMe.

Les données surveillées comprennent notamment :

* la température ;
* le pourcentage d'usure ;
* les erreurs d'intégrité des données ;
* les avertissements critiques ;
* l'état général SMART.

---

## 2. UserParameters

```conf
UserParameter=nvme.temperature,sudo /usr/sbin/smartctl -A /dev/nvme0 | awk -F: '/Temperature:/{print int($2)}'
UserParameter=nvme.percentage_used,sudo /usr/sbin/smartctl -A /dev/nvme0 | awk -F: '/Percentage Used:/{gsub(/[% ]/,"",$2); print int($2)}'
UserParameter=nvme.media_errors,sudo /usr/sbin/smartctl -A /dev/nvme0 | awk -F: '/Media and Data Integrity Errors:/{print int($2)}'
UserParameter=nvme.critical_warning,sudo /usr/sbin/smartctl -A /dev/nvme0 | awk -F: '/Critical Warning:/{gsub(/ /,"",$2); if($2=="0x00" || $2=="0x0") print 0; else print 1}'
UserParameter=nvme.smart_health,sudo /usr/sbin/smartctl -H /dev/nvme0 | grep PASSED >/dev/null && echo 1 || echo 0
```

---

## 3. Sécurité

L'accès à `smartctl` est réalisé via `sudo`.

Le compte `zabbix` ne reçoit pas de privilèges administrateur génériques.

La configuration sudoers associée doit limiter précisément l'exécution aux commandes nécessaires à la supervision du périphérique NVMe.

---

## 4. Dépendances

Ce fichier nécessite notamment :

* Zabbix Agent 2 ;
* `smartctl` ;
* le périphérique `/dev/nvme0` ;
* les règles sudoers associées.

---

## 5. Validation

Les clés doivent être testées localement avant leur utilisation dans les items Zabbix.

Le service utilisé par le laboratoire est exclusivement :

```text
zabbix-agent2.service
```
