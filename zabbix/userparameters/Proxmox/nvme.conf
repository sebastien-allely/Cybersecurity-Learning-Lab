# UserParameters NVMe

| Élément                           | Valeur                                                                                       |
| --------------------------------- | -------------------------------------------------------------------------------------------- |
| **Nom du document**               | `nvme.conf`                                                                                  |
| **Technologie**                   | Zabbix Agent 2 / NVMe / SMART                                                                |
| **Catégorie**                     | Matériel / Supervision                                                                       |
| **Objectif**                      | Exposer à Zabbix les indicateurs de santé du périphérique NVMe utilisé par l'infrastructure. |
