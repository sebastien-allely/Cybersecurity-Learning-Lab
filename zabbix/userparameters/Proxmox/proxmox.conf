# UserParameters Proxmox

| Élément                           | Valeur                                                                                                                          |
| --------------------------------- | ------------------------------------------------------------------------------------------------------------------------------- |
| **Nom du document**               | `proxmox.conf`                                                                                                                  |
| **Technologie**                   | Zabbix Agent 2 / Proxmox VE                                                                                                     |
| **Catégorie**                     | Supervision                                                                                                                     |
| **Objectif**                      | Définir les UserParameters permettant à Zabbix Agent 2 de collecter les informations spécifiques à l'infrastructure Proxmox VE. |
| **Auteur**                        | Sébastien Allely                                                                                                                |
| **Version**                       | 1.0                                                                                                                             |
| **Date de dernière modification** | 08/08/2026                                                                                                                      |

---

## 1. Rôle

Ce fichier contient les UserParameters utilisés par **Zabbix Agent 2** pour exposer à Zabbix des informations qui ne sont pas directement disponibles via les métriques standards de l'agent.

Les paramètres concernent notamment :

* l'état du quorum Proxmox ;
* le nombre de nœuds ;
* le nombre de votes ;
* l'état des services Proxmox ;
* l'utilisation des stockages ;
* l'état du pool ZFS ;
* l'état du bond réseau ;
* l'utilisation des volumes LVM.

---

## 2. UserParameters

```conf
UserParameter=proxmox.quorum,sudo /usr/bin/pvecm status | awk -F': ' '/Quorate:/ {print $2}' | xargs
UserParameter=proxmox.nodes,sudo /usr/bin/pvecm status | awk '/Nodes:/ {print $2}'
UserParameter=proxmox.votes,sudo /usr/bin/pvecm status | awk -F': ' '/Expected votes/ {print $2}' | xargs

UserParameter=proxmox.service.pvedaemon,systemctl is-active pvedaemon
UserParameter=proxmox.service.pveproxy,systemctl is-active pveproxy
UserParameter=proxmox.service.pvestatd,systemctl is-active pvestatd
UserParameter=proxmox.service.cluster,systemctl is-active pve-cluster

UserParameter=proxmox.storage.local,df -P / | awk 'NR==2 {print $5}' | tr -d '%'

UserParameter=proxmox.zfs.health,RESULT=$(sudo /sbin/zpool list -H -o health 2>/dev/null); [ -z "$RESULT" ] && echo NOZFS || echo $RESULT

UserParameter=bond.active_slave[*],awk -F': ' '/Currently Active Slave/ {print $2}' /proc/net/bonding/$1

UserParameter=proxmox.lvm.data,LC_ALL=C lvs --noheadings -o data_percent pve/data | tr -d ' %'
UserParameter=proxmox.lvm.metadata,LC_ALL=C lvs --noheadings -o metadata_percent pve/data | tr -d ' %'
```

---

## 3. Sécurité

Les commandes nécessitant des privilèges élevés utilisent `sudo` avec des règles dédiées.

Le compte `zabbix` ne reçoit pas de privilèges administrateur génériques.

Les droits sudo doivent rester limités aux commandes strictement nécessaires à la supervision.

---

## 4. Dépendances

Ce fichier dépend notamment des composants suivants :

* Zabbix Agent 2 ;
* Proxmox VE ;
* `pvecm` ;
* `systemctl` ;
* `df` ;
* `zpool` lorsque ZFS est utilisé ;
* `awk` ;
* `lvs` lorsque LVM est utilisé ;
* configuration sudoers associée au compte `zabbix`.

---

## 5. Validation

Après modification, la configuration doit être validée localement avec les clés Zabbix correspondantes.

Le service utilisé par le laboratoire est exclusivement :

```text
zabbix-agent2.service
```

Aucune configuration destinée à l'ancien **Zabbix Agent 1** ne fait partie du périmètre du laboratoire.
