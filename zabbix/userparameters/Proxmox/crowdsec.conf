# UserParameters CrowdSec

| Élément                           | Valeur                                                                                              |
| --------------------------------- | --------------------------------------------------------------------------------------------------- |
| **Nom du document**               | `crowdsec.conf`                                                                                     |
| **Technologie**                   | Zabbix Agent 2 / CrowdSec                                                                           |
| **Catégorie**                     | Sécurité / Supervision                                                                              |
| **Objectif**                      | Exposer à Zabbix les informations nécessaires à la supervision de l'état de CrowdSec et de sa LAPI. |
| **Auteur**                        | Sébastien Allely                                                                                    |
| **Version**                       | 1.0                                                                                                 |
| **Date de dernière modification** | 08/08/2026                                                                                          |

---

## 1. Rôle

Ce fichier permet à Zabbix Agent 2 de récupérer les informations nécessaires au suivi de CrowdSec.

Les données exposées permettent notamment de :

* récupérer les métriques CrowdSec au format JSON ;
* vérifier la disponibilité de la LAPI.

---

## 2. UserParameters

```conf
UserParameter=crowdsec.metrics.raw,/usr/bin/cscli metrics -o json 2>/dev/null
UserParameter=crowdsec.lapi.status,cscli lapi status >/dev/null 2>&1 && echo 1 || echo 0
```

---

## 3. Utilisation dans Zabbix

La donnée brute fournie par :

```text
crowdsec.metrics.raw
```

peut être exploitée par les mécanismes de traitement et de découverte prévus dans la configuration Zabbix du laboratoire.

La clé :

```text
crowdsec.lapi.status
```

permet de déterminer si la LAPI est disponible.

---

## 4. Sécurité

Les commandes utilisées sont limitées à la collecte d'informations.

Aucune commande de modification de configuration ou de gestion des décisions CrowdSec n'est exécutée par ces UserParameters.

---

## 5. Dépendances

Ce fichier nécessite notamment :

* Zabbix Agent 2 ;
* CrowdSec ;
* `cscli` ;
* la LAPI CrowdSec pour la vérification de son état.

---

## 6. Validation

Les clés doivent être testées localement avant leur intégration dans les items Zabbix correspondants.

Le service utilisé par le laboratoire est exclusivement :

```text
zabbix-agent2.service
```
