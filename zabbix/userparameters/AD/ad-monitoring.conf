# AD monitoring — Zabbix Agent 2

| Élément                           | Valeur                                                                                                                                    |
| --------------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------- |
| **Nom du document**               | `ad-monitoring.conf`                                                                                                                      |
| **Technologie**                   | Zabbix Agent 2 / Active Directory                                                                                                         |
| **Catégorie**                     | Supervision                                                                                                                               |
| **Objectif**                      | Fournir à Zabbix Agent 2 les métriques spécifiques nécessaires à la supervision du contrôleur de domaine Active Directory du laboratoire. |
| **Auteur**                        | Sébastien Allely                                                                                                                          |
| **Version**                       | 1.0                                                                                                                                       |
| **Date de dernière modification** | 10/08/2026                                                                                                                                |

---

### Prérequis

Pour le besoin ici, le nom de domaine utilisé sur mon lab a été remplacé par **domain.local**, le contrôleur de
domaine aura comme nom d'hôte : **dc01**.

Il convient donc d'adapter à votre besoin, le nom de domaine qui correspond à votre nom de domaine de laboratoire.


### AD

UserParameter=ad.fsmo.count,powershell -NoProfile -ExecutionPolicy Bypass -Command "(netdom query fsmo | Select-String 'domain.local').Count"
UserParameter=ad.sysvol.present,powershell -NoProfile -ExecutionPolicy Bypass -Command "(Get-SmbShare -Name SYSVOL -ErrorAction SilentlyContinue).Name"
UserParameter=ad.dns.resolve.local,powershell -NoProfile -ExecutionPolicy Bypass -Command "try {(Resolve-DnsName 'dc01.domain.local' -Server 127.0.0.1 -ErrorAction Stop | Measure-Object).Count} catch {0}"
UserParameter=ad.replication.failures,powershell -NoProfile -ExecutionPolicy Bypass -Command "(repadmin /replsummary 2>$null | Select-String 'fails').Count"
UserParameter=ad.backup.age,powershell -NoProfile -ExecutionPolicy Bypass -Command "$v=(wbadmin get versions 2>$null | Select-String 'Identificateur de version' | Select-Object -First 1).Line; if($v -match '(\d{2})/(\d{2})/(\d{4})-(\d{2}):(\d{2})'){ [int]((Get-Date)-([datetime]::ParseExact("$($matches[2])/$($matches[1])/$($matches[3]) $($matches[4]):$($matches[5])",'MM/dd/yyyy HH:mm',$null))).TotalHours } else {9999}"
UserParameter=ad.backup.present,powershell -NoProfile -ExecutionPolicy Bypass -Command "(wbadmin get versions 2>$null | Select-String 'Identificateur de version').Count"
UserParameter=ad.backup.status,powershell -NoProfile -ExecutionPolicy Bypass -Command "if((wbadmin get status 2>$null | Select-String 'Aucune operation').Count -gt 0){0}else{1}"
UserParameter=ad.dfsr.backlog,powershell -NoProfile -ExecutionPolicy Bypass -Command "(Get-WinEvent -LogName 'DFS Replication' -MaxEvents 200 | Where-Object {$_.Id -eq 4102}).Count"

### Sessions utilisateurs

UserParameter=windows.users.count,powershell -NoProfile -Command "(quser 2>$null | Select-Object -Skip 1).Count"
UserParameter=windows.users.list,powershell -NoProfile -Command "quser 2>$null | Select-Object -Skip 1 | Out-String"

### DNS SRV

UserParameter=ad.dns.srv,powershell -NoProfile -Command "try { if((Resolve-DnsName '_ldap._tcp.dc._msdcs.domain.local' -Type SRV -ErrorAction Stop).Count -gt 0){1}else{0} } catch {0}"
